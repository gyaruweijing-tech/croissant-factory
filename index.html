<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クロワッサン工場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* 縦1画面：上=数とゲージ、中=工場（在庫→作業台→オーブン→トレイ）、下=次の操作ヒント */
  :root {
    --bg: #fbf1df;      /* 工場の壁：小麦粉っぽいクリーム */
    --ink: #4a2f1c;     /* 線画と同じこげ茶 */
    --crust: #d9893a;   /* 焼き色 */
    --dough: #f4dfb6;   /* 生地 */
    --f: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; gap: 6px; }
  .hud { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
  .hud b { margin-left: 4px; font-size: 20px; font-variant-numeric: tabular-nums; }
  .hud .ok b { color: var(--crust); }
  .hud .ng b { color: var(--ink); }
  .hud .raw b { color: #b9a27e; }
  .gauge { position: relative; height: 14px; border: 2.5px solid var(--ink); border-radius: 9px; overflow: hidden; }
  .gauge i { position: absolute; top: -2px; bottom: -2px; left: 0; width: 4px; border-radius: 2px; background: var(--ink); }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .hint { min-height: 2.8em; text-align: center; font-weight: 700; font-size: 15px; }
  .start {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    color: var(--ink);
    font-family: var(--f);
    font-weight: 900;
    font-size: 26px;
    cursor: pointer;
  }
  .start small { font-size: 14px; font-weight: 500; }
  .start:focus-visible { outline: 3px solid var(--crust); }
  .start[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="ok">成功<b id="cOk">0</b></span>
    <span class="ng">焦げ<b id="cNg">0</b></span>
    <span class="raw">生焼け<b id="cRaw">0</b></span>
  </div>
  <div class="gauge" id="gauge"><i id="needle"></i></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="start" id="start">タップしてスタート<small>音が出ます</small></button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script>
// ===== 調整しやすい値 =====
const CONFIG = {
  GAUGE_SPEED: 0.2,      // 焼きゲージが1秒に進む量（ゲージ全体＝1）
  RAW_WIDTH: 0.45,       // 「生焼け」区間の幅
  GOOD_WIDTH: 0.25,      // 「ちょうどいい」区間の幅（残りが「焦げ」）
  ROLL_STEP: 0.125,      // 1回のクリック・タップ・←キーで転がる量（全体＝1）
  ROLL_ANIM_SPEED: 1.5,  // クリック・タップで転がるときの速さ（1秒あたり）
  DRAG_DIST: 260,        // 最後まで巻くのに必要なドラッグ距離（画面の論理座標。小さいほど敏感）
  FLICK_MIN: 40,         // 下へはじいたとみなす距離（同上）
  STOCK: 4,              // 在庫の数
  TRAY: 5,               // トレイに並べる数
  RESULT_HOLD: 0.8,      // 焼き上がりを見せる時間（秒）
  TICK_INTERVAL: 0.5,    // チクタクの間隔（秒）
};

// ===== 画像 =====
const IMG = {};
['04_rolled_raw', '05_baked_proud', '06_baked_hot', '07_burnt', '08_undercooked',
 '09_raw_worried', '10_plain_sleep', '11_plain_ball'].forEach(n => {
  const i = new Image();
  i.src = 'images/' + n + '.png';
  IMG[n] = i;
});

// ===== 画面（論理座標 360x600 を画面に合わせて拡大縮小） =====
const W = 360, H = 600;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stageEl = document.getElementById('stage');
let scale = 1, offX = 0, offY = 0;
function fit() {
  const r = stageEl.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d;
  cv.height = r.height * d;
  scale = Math.min(r.width / W, r.height / H);
  offX = (r.width - W * scale) / 2;
  offY = (r.height - H * scale) / 2;
  ctx.setTransform(d * scale, 0, 0, d * scale, d * offX, d * offY);
}
new ResizeObserver(fit).observe(stageEl);
fit();

const RAW_END = CONFIG.RAW_WIDTH, GOOD_END = CONFIG.RAW_WIDTH + CONFIG.GOOD_WIDTH;
document.getElementById('gauge').style.background =
  `linear-gradient(90deg, var(--dough) 0 ${RAW_END * 100}%, #f6c983 ${RAW_END * 100}% ${GOOD_END * 100}%, #8a5a34 ${GOOD_END * 100}% 100%)`;

// ===== 配置 =====
const SHELF_Y = 120, TABLE_Y = 290, TRAY_Y = 575;
const OVEN = { x: 95, y: 350, w: 170, h: 120 };
const OVEN_CX = OVEN.x + OVEN.w / 2;
const ROLL_START = 262, ROLL_END = 96, SHEET_L = 24, BALL_R = 30;
const LAND = { x: OVEN_CX, y: OVEN.y + OVEN.h + 72, s: 0.3 };  // オーブンから出て着地する所
const stockX = i => 300 - i * 80;
const trayX = i => 320 - i * 68;

// ===== 音（Web Audio API で合成） =====
let ac = null, master = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.8;
    master.connect(ac.destination);
    if (ac.state === 'suspended') ac.resume();
  } catch (_) { ac = null; }
}
function tone({ f, d, type = 'sine', v = 0.2, slide = 1, at = 0 }) {
  if (!ac) return;
  const t = ac.currentTime + at;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + d + 0.05);
}
const S = {
  pof: () => tone({ f: 220, d: 0.12, type: 'triangle', v: 0.3, slide: 0.5 }),
  hop: () => tone({ f: 500, d: 0.12, v: 0.15, slide: 2 }),
  slide: () => tone({ f: 300, d: 0.3, type: 'triangle', v: 0.15, slide: 0.4 }),
  tick: () => tone({ f: 1400, d: 0.03, type: 'square', v: 0.04 }),
  chin: () => {
    tone({ f: 2093, d: 0.08, type: 'triangle', v: 0.12 });
    tone({ f: 1760, d: 1.2, v: 0.25 });
    tone({ f: 2640, d: 0.7, v: 0.1 });
  },
  bubu: () => {
    tone({ f: 140, d: 0.25, type: 'sawtooth', v: 0.15 });
    tone({ f: 120, d: 0.35, type: 'sawtooth', v: 0.15, at: 0.28 });
  },
  shobon: () => {
    tone({ f: 523, d: 0.25, type: 'triangle', v: 0.25, slide: 0.94 });
    tone({ f: 392, d: 0.6, type: 'triangle', v: 0.25, slide: 0.8, at: 0.3 });
  },
};

// ===== 描画の部品 =====
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const ready = i => i && i.complete && i.naturalWidth;
// 画像を「下はし中央」基準で描く
function drawImg(n, cx, by, s) {
  const i = IMG[n];
  if (!ready(i)) return;
  const w = i.naturalWidth * s, h = i.naturalHeight * s;
  ctx.drawImage(i, cx - w / 2, by - h, w, h);
}
// 寝ている素の犬（寝息で少し上下）
function plainDog(cx, by, s, t) {
  const i = IMG['10_plain_sleep'];
  if (!ready(i)) return;
  const w = 230 * s, h = w * i.naturalHeight / i.naturalWidth, b = 1 + Math.sin(t * 2.5) * 0.025;
  ctx.drawImage(i, cx - w / 2, by - h * b, w, h * b);
}
// 丸まった犬。ang で回転、wrap(0〜1) で生地の帯が巻きつく
function ballDog(cx, cy, ang, wrap) {
  const i = IMG['11_plain_ball'];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  if (ready(i)) {
    const w = BALL_R * 2.4, h = w * i.naturalHeight / i.naturalWidth;
    ctx.drawImage(i, -w / 2, -h / 2, w, h);
  }
  const th = 4 + wrap * 12, span = wrap * Math.PI * 1.55;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a2f1c';
  ctx.lineWidth = th + 5;
  ctx.beginPath();
  ctx.arc(0, 0, BALL_R + th / 2 - 1, Math.PI * 1.5 - span / 2, Math.PI * 1.5 + span / 2);
  ctx.stroke();
  ctx.strokeStyle = '#f4dfb6';
  ctx.lineWidth = th;
  ctx.stroke();
  ctx.restore();
}

// ===== 状態 =====
// start → arrive → roll → ready → toOven → bake → result → arrive ...
let st = 'start', t = 0;
let p = 0, pTarget = 0;          // 巻けた量（0〜1）
let heat = 0, lastTick = 0;      // 焼きゲージ
let res = null, resT = 0;        // 焼き上がりの絵と経過時間
let mover = null;                // 移動アニメ（在庫→台 / 台→オーブン / 着地→トレイ）
const cnt = { ok: 0, ng: 0, raw: 0 };
const stock = [];
for (let i = 0; i < CONFIG.STOCK; i++) stock.push({ x: stockX(i), tx: stockX(i), ph: Math.random() * 6 });
let tray = [];                   // { n: 絵, x, tx }

const hintEl = document.getElementById('hint'), needle = document.getElementById('needle');
const H_ROLL = '← 左になぞって転がす（クリック・タップ・←キーでもOK）';
const H_OVEN = '↓ 下にはじいてオーブンへ（クリック・タップ・↓キーでもOK）';
const H_BAKE = 'いい焼き色でタップ！（クリック・スペースキーでもOK）';
const setHint = s => { hintEl.textContent = s; };

function nextDog() {
  st = 'arrive';
  p = pTarget = 0;
  heat = 0;
  const d = stock.shift();
  mover = { from: { x: d.x, y: SHELF_Y, s: 0.36 }, to: { x: ROLL_START, y: TABLE_Y - 6, s: 0.5 }, dur: 0.55, kind: 'plain', ph: d.ph };
  S.hop();
  stock.forEach((s, i) => { s.tx = stockX(i); });
  stock.push({ x: -80, tx: stockX(CONFIG.STOCK - 1), ph: Math.random() * 6 });
  setHint('');
}

function rollBy(amount) {
  if (st !== 'roll') return;
  pTarget = Math.min(1, Math.max(pTarget, p) + amount);
}
function setRoll(np) {
  if (Math.floor(np * 8) > Math.floor(p * 8)) S.pof();
  p = np;
  if (p >= 1) { st = 'ready'; setHint(H_OVEN); }
}

function toOven() {
  if (st !== 'ready') return;
  st = 'toOven';
  S.slide();
  mover = { from: { x: ROLL_END + 20, y: TABLE_Y + 2, s: 0.38 }, to: { x: OVEN_CX, y: OVEN.y + OVEN.h - 16, s: 0.28 }, dur: 0.5, kind: '09_raw_worried' };
  setHint('');
}

function takeOut() {
  if (st !== 'bake') return;
  let kind;
  if (heat < RAW_END) { kind = 'raw'; res = '08_undercooked'; S.shobon(); }
  else if (heat < GOOD_END) { kind = 'ok'; res = Math.random() < 0.5 ? '05_baked_proud' : '06_baked_hot'; S.chin(); }
  else { kind = 'ng'; res = '07_burnt'; S.bubu(); }
  cnt[kind]++;
  document.getElementById({ ok: 'cOk', ng: 'cNg', raw: 'cRaw' }[kind]).textContent = cnt[kind];
  st = 'result';
  resT = 0;
  setHint({ ok: 'こんがり！', ng: '焦げた…', raw: 'まだ白い…' }[kind]);
}

function toTray() {
  st = 'toTray';
  S.hop();
  mover = { from: LAND, to: { x: trayX(0), y: TRAY_Y + 2, s: 0.16 }, dur: 0.45, kind: res };
}

function arrived(m) {
  if (m.kind === 'plain') { st = 'roll'; setHint(H_ROLL); }
  else if (st === 'toOven') { st = 'bake'; lastTick = t; setHint(H_BAKE); }
  else {
    tray.forEach(d => { d.tx -= 68; });
    tray.unshift({ n: m.kind, x: trayX(0), tx: trayX(0) });
    tray = tray.slice(0, CONFIG.TRAY);
    nextDog();
  }
}

// ===== 操作 =====
const toLogical = e => {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale };
};
let drag = null;   // { x, y, sx, sy, st: 押した時の状態, moved }
cv.addEventListener('pointerdown', e => {
  const q = toLogical(e);
  drag = { x: q.x, y: q.y, sx: q.x, sy: q.y, st, moved: false };
  if (st === 'bake') takeOut();
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const q = toLogical(e);
  if (Math.hypot(q.x - drag.sx, q.y - drag.sy) > 10) drag.moved = true;
  if (st === 'roll' && drag.st === 'roll') {
    const dx = drag.x - q.x;
    if (dx > 0) { setRoll(Math.min(1, p + dx / CONFIG.DRAG_DIST)); pTarget = Math.max(pTarget, p); }
    drag.x = q.x;
  }
  if (st === 'ready' && drag.st === 'ready' && q.y - drag.sy > CONFIG.FLICK_MIN) { toOven(); drag = null; }
});
cv.addEventListener('pointerup', () => {
  if (drag && !drag.moved && drag.st === st) {
    if (st === 'roll') rollBy(CONFIG.ROLL_STEP);
    else if (st === 'ready') toOven();
  }
  drag = null;
});
cv.addEventListener('pointercancel', () => { drag = null; });

const startBtn = document.getElementById('start');
startBtn.addEventListener('click', () => {
  startBtn.hidden = true;
  initAudio();
  nextDog();
});
addEventListener('keydown', e => {
  if (st === 'start') return;
  if (e.key === 'ArrowLeft') { rollBy(CONFIG.ROLL_STEP); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { toOven(); e.preventDefault(); }
  else if (e.key === ' ') { takeOut(); e.preventDefault(); }
});

// ===== 毎フレームの更新と描画 =====
const ease = x => 1 - Math.pow(1 - x, 3);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  t += dt;
  ctx.clearRect(-W, -H, W * 3, H * 3);
  ctx.font = '700 12px ' + getComputedStyle(document.body).fontFamily;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#4a2f1c';

  // クリック・タップ・キーで進めた分をなめらかに転がす
  if (st === 'roll' && p < pTarget) setRoll(Math.min(pTarget, p + CONFIG.ROLL_ANIM_SPEED * dt));

  // 在庫の棚（全員同じ向き）
  ctx.fillStyle = '#e9cfa2';
  rr(6, SHELF_Y, 348, 12, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a5a40';
  ctx.fillText('ざいこ', 12, SHELF_Y + 28);
  stock.forEach(s => {
    s.x += (s.tx - s.x) * Math.min(1, dt * 6);
    plainDog(s.x, SHELF_Y, 0.36, t + s.ph);
  });

  // 作業台と生地
  ctx.fillStyle = '#e6c79a';
  rr(6, TABLE_Y + 2, 348, 26, 6); ctx.fill(); ctx.stroke();
  if (st === 'arrive' || st === 'roll') {
    // 犬が生地の上を左へ転がる。通ったあとの生地は犬に巻き取られて消える
    const x = ROLL_START - (ROLL_START - ROLL_END) * p;
    ctx.fillStyle = '#f4dfb6';
    rr(SHEET_L, TABLE_Y - 12, Math.max(0, x - SHEET_L + 10), 14, 7); ctx.fill(); ctx.stroke();
    if (st === 'roll') {
      if (p === 0) plainDog(ROLL_START, TABLE_Y - 6, 0.5, t);
      else if (p < 0.92) { const r = BALL_R + 4 + p * 12; ballDog(x, TABLE_Y - r + 4, -(ROLL_START - x) / r, p); }
      else drawImg('04_rolled_raw', ROLL_END + 20, TABLE_Y + 2, 0.38);
    }
    if (st === 'roll' && p === 0) {
      // 「左へ」の矢印
      const a = (Math.sin(t * 4) + 1) / 2, hx = ROLL_START - 90 - a * 40;
      ctx.globalAlpha = 0.4 + 0.6 * a;
      ctx.fillStyle = '#4a2f1c';
      ctx.beginPath();
      ctx.moveTo(hx, TABLE_Y - 70); ctx.lineTo(hx + 16, TABLE_Y - 80); ctx.lineTo(hx + 16, TABLE_Y - 60);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (st === 'ready') drawImg('04_rolled_raw', ROLL_END + 20, TABLE_Y + 2 + Math.sin(t * 10), 0.38);

  // オーブン
  const o = OVEN;
  ctx.fillStyle = '#9aa0a8';
  rr(o.x, o.y, o.w, o.h, 14); ctx.fill(); ctx.stroke();
  const glow = st === 'bake' ? heat : 0;
  ctx.fillStyle = `rgb(255, ${Math.round(232 - glow * 90)}, ${Math.round(196 - glow * 150)})`;
  rr(o.x + 14, o.y + 24, o.w - 28, o.h - 38, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffaf3';
  ctx.fillText('OVEN', o.x + 14, o.y + 17);
  ctx.fillStyle = st === 'bake' ? '#ff5a2a' : '#4a2f1c';
  ctx.beginPath(); ctx.arc(o.x + o.w - 18, o.y + 12, 6, 0, 7); ctx.fill();
  if (st === 'bake') {
    heat = Math.min(1, heat + dt * CONFIG.GAUGE_SPEED);
    if (t - lastTick > CONFIG.TICK_INTERVAL) { S.tick(); lastTick = t; }
    drawImg('09_raw_worried', OVEN_CX + Math.sin(t * 30) * heat * 1.5, o.y + o.h - 16, 0.28);
    // 窓の色が焼き色に変わっていく
    ctx.fillStyle = `rgba(217, 137, 58, ${Math.min(0.55, heat * 0.6)})`;
    rr(o.x + 14, o.y + 24, o.w - 28, o.h - 38, 8); ctx.fill();
    if (heat >= 1) takeOut();
  }
  needle.style.left = `calc(${heat * 100}% - 2px)`;

  // できあがりトレイ
  ctx.fillStyle = '#c9a27a';
  rr(6, TRAY_Y, 348, 12, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a5a40';
  ctx.fillText('できあがり', 12, TRAY_Y - 48);
  tray.forEach(d => {
    d.x += (d.tx - d.x) * Math.min(1, dt * 8);
    drawImg(d.n, d.x, TRAY_Y + 2, 0.16);
  });

  // 焼き上がり：オーブンからぴょんと出て着地、少し見せてからトレイへ
  if (st === 'result') {
    resT += dt;
    const k = Math.min(1, resT / 0.45);
    const x = OVEN_CX, y = (o.y + o.h - 16) + (LAND.y - (o.y + o.h - 16)) * k - Math.sin(k * Math.PI) * 60;
    drawImg(res, x, y, 0.28 + (LAND.s - 0.28) * k);
    if (resT >= 0.45 + CONFIG.RESULT_HOLD) toTray();
  }

  // 移動アニメ（ぴょんと弧を描く）
  if (mover) {
    mover.t = (mover.t || 0) + dt;
    const k = ease(Math.min(1, mover.t / mover.dur)), f = mover.from, g = mover.to;
    const x = f.x + (g.x - f.x) * k, y = f.y + (g.y - f.y) * k - Math.sin(k * Math.PI) * 40, s = f.s + (g.s - f.s) * k;
    if (mover.kind === 'plain') plainDog(x, y, s, t + mover.ph);
    else drawImg(mover.kind, x, y, s);
    if (k >= 1) { const m = mover; mover = null; arrived(m); }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
